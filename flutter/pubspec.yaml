name: room_2_0
description: Room 2.0 - Mobile booking and management system
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.20.0
  cloud_firestore: ^4.10.0
  google_maps_flutter: ^2.5.0
  google_maps_flutter_web: ^0.5.0
  provider: ^6.0.0
  http: ^1.1.0
  intl: ^0.19.0
  cached_network_image: ^3.3.0
  flutter_rating_bar: ^4.0.1
  search_page: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
